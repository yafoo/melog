name: Docker Image CI

on:
  push:
    branches:
      - "master"
      - "develop"
    tags:
      - "v*"

# 设置工作流权限
permissions:
  contents: read
  packages: write

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/melog

jobs:
  # ---- 构建 amd64 ----
  build-amd64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (amd64)
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64
          context: .
          file: ./docker/Dockerfile
          outputs: type=docker,name=local/amd64:latest,dest=/tmp/image-amd64.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload artifact (amd64)
        uses: actions/upload-artifact@v4
        with:
          name: image-amd64
          path: /tmp/image-amd64.tar
          retention-days: 1

  # ---- 构建 arm64（原生 ARM 构建器，避免 QEMU 模拟编译崩溃） ----
  build-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (arm64)
        uses: docker/build-push-action@v6
        with:
          platforms: linux/arm64
          context: .
          file: ./docker/Dockerfile
          outputs: type=docker,name=local/arm64:latest,dest=/tmp/image-arm64.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload artifact (arm64)
        uses: actions/upload-artifact@v4
        with:
          name: image-arm64
          path: /tmp/image-arm64.tar
          retention-days: 1

  # ---- 合并为多平台 manifest ----
  merge:
    runs-on: ubuntu-latest
    needs: [build-amd64, build-arm64]
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=schedule,pattern=nightly
            type=ref,event=pr
            type=ref,event=branch
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{version}}

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: image-*
          path: /tmp

      - name: Load images and create manifest
        run: |
          docker load -i /tmp/image-amd64/image-amd64.tar
          docker load -i /tmp/image-arm64/image-arm64.tar

          # 使用 docker manifest 从本地镜像创建多平台 manifest
          echo "${TAGS}" | while read -r TAG; do
            [ -z "$TAG" ] && continue
            docker manifest create "$TAG" local/amd64:latest local/arm64:latest
            docker manifest push "$TAG"
          done
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
