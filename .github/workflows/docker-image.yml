name: Docker Image CI

on:
  push:
    branches:
      - "master"
      - "develop"
    tags:
      - "v*"

# 设置工作流权限
permissions:
  contents: read
  packages: write

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/melog

jobs:
  # ---- 构建 amd64（QEMU 模拟，有预编译包无需编译） ----
  build-amd64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push (amd64)
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAME }}:temp-amd64-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---- 构建 arm64（原生 ARM 构建器，避免 QEMU 模拟编译崩溃） ----
  build-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push (arm64)
        uses: docker/build-push-action@v6
        with:
          platforms: linux/arm64
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAME }}:temp-arm64-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---- 合并为多平台 manifest ----
  merge:
    runs-on: ubuntu-latest
    needs: [build-amd64, build-arm64]
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=schedule,pattern=nightly
            type=ref,event=pr
            type=ref,event=branch
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{version}}

      - name: Create and push multi-platform manifest
        run: |
          TAGS="${{ steps.meta.outputs.tags }}"
          TEMP_AMD64="${{ env.IMAGE_NAME }}:temp-amd64-${{ github.sha }}"
          TEMP_ARM64="${{ env.IMAGE_NAME }}:temp-arm64-${{ github.sha }}"

          for TAG in $TAGS; do
            docker buildx imagetools create -t "$TAG" "$TEMP_AMD64" "$TEMP_ARM64"
          done
